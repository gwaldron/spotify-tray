name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        shell: pwsh
        run: |
          $project = [xml](Get-Content SpotifyWidget/SpotifyWidget.csproj -Raw)
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match the project version v$version."
          }
      - name: Build, check, and package
        shell: pwsh
        run: ./build-installer.ps1
      - name: Test installation, upgrade, and uninstall
        shell: pwsh
        run: ./tests/installer-smoke.ps1
      - name: Upload Windows downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SpotifyWidget-Windows-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-smoke-logs
          path: artifacts/smoke-logs/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download tested installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SpotifyWidget-Windows-x64
          path: release
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --title "Spotify Widget $GITHUB_REF_NAME" --notes-file ../docs/release-notes.md
